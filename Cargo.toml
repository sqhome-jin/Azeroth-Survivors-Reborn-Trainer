[package]
name = "reborn-trainer"
version = "1.1.3"
edition = "2024"
rust-version = "1.93"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.33.3", default-features = false }
image = { version = "0.25", default-features = false }
iced-x86 = { version = "1.21", default-features = false, features = ["decoder", "instr_info", "std"] }
memchr = "2.8"
png = "0.18"
rfd = { version = "0.15.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr",
  "Storage_Streams", "Win32_System_WinRT",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
mach2 = "0.4"

[profile.release]
lto = "thin"
strip = "debuginfo"

[build-dependencies]
winresource = "0.1"
