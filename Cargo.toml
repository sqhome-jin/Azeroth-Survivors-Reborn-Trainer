[package]
name = "reborn-trainer"
version = "1.1.6"
edition = "2024"
rust-version = "1.93"

[lib]
name = "reborn_trainer"
crate-type = ["staticlib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "backend-smoke"
path = "src/bin/backend-smoke.rs"

[dependencies]
libc = "0.2"
mach2 = "0.4"
memchr = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"

[profile.release]
lto = "thin"
strip = "debuginfo"
