name: Build trainer and release Windows EXE

on:
  push:
    branches: [main, 'codex/rust-migration', 'codex/macos-port']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: '-C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - name: Read Cargo version
        id: version
        shell: pwsh
        run: |
          $manifest = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Cargo metadata.' }
          $version = ($manifest.packages | Where-Object name -eq 'reborn-trainer').version
          if ($version -notmatch '^\d+\.\d+\.[0-9]$') { throw "Invalid release version $version" }
          "value=$version" >> $env:GITHUB_OUTPUT
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - name: Verify standalone EXE and self-update
        shell: pwsh
        run: |
          $dist = New-Item -ItemType Directory -Path dist
          $exe = Join-Path $dist.FullName 'Azeroth.Survivor.Reborn.Trainer.exe'
          Copy-Item -LiteralPath 'target/release/reborn-trainer.exe' -Destination $exe
          foreach ($check in @('--smoke-test', '--smoke-test-update')) {
            $probe = Start-Process -FilePath $exe -WorkingDirectory $dist.FullName -ArgumentList $check -WindowStyle Hidden -PassThru -Wait
            if ($probe.ExitCode -ne 0) {
              $log = Join-Path $env:LOCALAPPDATA 'Azeroth Survivor Reborn Trainer/reborn-rust.log'
              if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 20 }
              throw "$check failed with exit code $($probe.ExitCode)"
            }
          }
          if ((Get-Item -LiteralPath $exe).Length -gt 64MB) { throw 'EXE exceeds the updater download limit.' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe | Format-List -Property Hash
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Reborn-Windows-x64
          path: dist/Azeroth.Survivor.Reborn.Trainer.exe
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked

      - name: Sign and package the Apple Silicon app
        run: |
          test "$(uname -m)" = arm64
          app="dist/Azeroth Survivor Reborn Trainer.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/release/reborn-trainer "$app/Contents/MacOS/"
          cp assets/macos/Info.plist "$app/Contents/"
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "reborn-trainer") | .version')"
          plutil -insert CFBundleVersion -string "$version" "$app/Contents/Info.plist"
          plutil -insert CFBundleShortVersionString -string "$version" "$app/Contents/Info.plist"
          codesign --force --sign - --entitlements assets/macos/debugger.entitlements "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" dist/Azeroth.Survivor.Reborn.Trainer.macos-arm64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Reborn-macOS-arm64
          path: dist/Azeroth.Survivor.Reborn.Trainer.macos-arm64.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: reborn-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Reborn-Windows-x64
          path: dist
      - name: Publish the stable EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $published = gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw 'Could not read published releases.' }
          $stable = @(($published | ConvertFrom-Json).tagName | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' })
          if ($stable | Where-Object { [version]$_.Substring(1) -ge [version]$env:RELEASE_VERSION }) {
            Write-Host "Skipping $tag because a matching or newer release already exists."
            exit 0
          }
          $ref = "refs/tags/$tag"
          $tagRefs = git ls-remote --tags origin "$ref" "$ref^{}"
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the release tag.' }
          if ($tagRefs) {
            $tagCommit = (($tagRefs | Select-Object -Last 1) -split '\s+')[0]
            if ($tagCommit -ne $env:GITHUB_SHA) { throw 'Existing tag points to a different commit.' }
          }
          gh release create $tag 'dist/Azeroth.Survivor.Reborn.Trainer.exe' --target "$env:GITHUB_SHA" --latest --title "Azeroth Survivor Reborn Trainer $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
