name: Build and release trainer

on:
  push:
    branches: [main, 'codex/rust-migration', 'codex/macos-port']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CARGO_TARGET_DIR: target
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup show
      - name: Read Cargo version
        id: version
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "reborn-trainer") | .version')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]$ ]]; then
            echo "Invalid release version $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build SwiftUI app and zip
        run: ./macos/build-app.sh dist
      - name: Smoke-test the backend and signature
        run: |
          ./target/release/backend-smoke --smoke-test
          codesign --verify --strict "dist/Azeroth Survivor Reborn Trainer.app"
          codesign --display --entitlements :- "dist/Azeroth Survivor Reborn Trainer.app" |
            grep -q com.apple.security.cs.debugger
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Reborn-macOS-arm64
          path: dist/Azeroth.Survivor.Reborn.Trainer.macos-arm64.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: reborn-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Reborn-macOS-arm64
          path: dist
      - name: Publish the stable macOS zip
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.macos.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          published="$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName)"
          if python3 - <<'PY' "$published" "$RELEASE_VERSION"
          import json, sys
          releases = json.loads(sys.argv[1])
          current = tuple(int(part) for part in sys.argv[2].split("."))
          for item in releases:
              tag = item["tagName"]
              if not tag.startswith("v"):
                  continue
              body = tag[1:]
              if body.count(".") != 2 or any(not part.isdigit() for part in body.split(".")):
                  continue
              version = tuple(int(part) for part in body.split("."))
              if version > current:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          then
            echo "Skipping $tag because a newer release already exists."
            exit 0
          fi
          if ! jq -e --arg tag "$tag" 'any(.[]; .tagName == $tag)' <<<"$published" >/dev/null; then
            gh release create "$tag" dist/Azeroth.Survivor.Reborn.Trainer.macos-arm64.zip \
              --target "$GITHUB_SHA" --latest \
              --title "Azeroth Survivor Reborn Trainer $tag" \
              --notes-file RELEASE_NOTES.md
          fi
          for attempt in 1 2 3 4 5 6; do
            assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[].name' || true)"
            if grep -qx 'Azeroth.Survivor.Reborn.Trainer.macos-arm64.zip' <<<"$assets"; then
              exit 0
            fi
            sleep 10
          done
          echo "Published release is missing the macOS zip asset." >&2
          exit 1
